name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [subchart-update]

permissions:
  contents: write
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v5

      - name: Login to GHCR (helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Helm dependency update
        run: helm dependency update chart/rig

      - name: Helm lint
        run: helm lint chart/rig

      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
          cache: npm

      - name: Build check
        if: github.event_name == 'pull_request'
        run: npm ci && npm run build

  build:
    needs: [lint]
    if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    env:
      REPO_LC: ""
    steps:
      - uses: actions/checkout@v5

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ env.REPO_LC }}/images/rig
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  helm:
    needs: [lint, build]
    if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      chart-version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Bump chart version
        id: version
        run: |
          cd chart/rig
          CURRENT=$(grep '^version:' Chart.yaml | awk '{print $2}')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          sed -i "s/^version: .*/version: $NEXT/" Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$NEXT\"/" Chart.yaml
          echo "CHART_VERSION=$NEXT" >> "$GITHUB_ENV"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Update sub-chart version from dispatch
        if: github.event_name == 'repository_dispatch'
        run: |
          SOURCE="${{ github.event.client_payload.source }}"
          VERSION="${{ github.event.client_payload.chartVersion }}"
          if [ "$SOURCE" = "preamp" ]; then
            sed -i "/name: preamp/{n;s/version: .*/version: \"$VERSION\"/}" chart/rig/Chart.yaml
          elif [ "$SOURCE" = "gain" ]; then
            sed -i "/name: gain-downloader/{n;s/version: .*/version: \"$VERSION\"/}" chart/rig/Chart.yaml
          fi

      - name: Commit and push chart changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/rig/Chart.yaml
          git diff --cached --quiet || git commit -m "chart: bump to $CHART_VERSION"
          git push

      - name: Helm dependency update
        run: helm dependency update chart/rig

      - name: Package and push chart
        run: |
          helm package chart/rig
          REPO="${{ github.repository }}"
          helm push rig-*.tgz "oci://ghcr.io/${REPO,,}/charts"

  update-gitops:
    needs: [build, helm]
    if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TALOS_CLUSTER_DEPLOY_KEY }}

      - name: Update talos-cluster
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE: ${{ github.event.client_payload.source }}
          SOURCE_IMAGE_TAG: ${{ github.event.client_payload.imageTag }}
          SOURCE_FRONTEND_TAG: ${{ github.event.client_payload.frontendTag }}
          SOURCE_BACKEND_TAG: ${{ github.event.client_payload.backendTag }}
          CHART_VERSION: ${{ needs.helm.outputs.chart-version }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          git clone git@github.com:BenRachmiel/talos-cluster.git
          cd talos-cluster

          # Bump chart version in config
          sed -i "s/chartVersion: .*/chartVersion: $CHART_VERSION/" apps/rig/config.yaml

          # Always update rig image tag
          sed -i "0,/tag: sha-[a-f0-9]*/s//tag: $TAG/" apps/rig/values.yaml

          # On dispatch, also update sub-chart image tags
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            if [ "$SOURCE" = "preamp" ] && [ -n "$SOURCE_IMAGE_TAG" ]; then
              sed -i "/preamp:/,/gain-downloader:/{s/tag: sha-[a-f0-9]*/tag: $SOURCE_IMAGE_TAG/g}" apps/rig/values.yaml
            elif [ "$SOURCE" = "gain" ]; then
              if [ -n "$SOURCE_FRONTEND_TAG" ]; then
                sed -i "/gain-downloader:/,\$/{/frontend:/{n;s/tag: sha-[a-f0-9]*/tag: $SOURCE_FRONTEND_TAG/}}" apps/rig/values.yaml
              fi
              if [ -n "$SOURCE_BACKEND_TAG" ]; then
                sed -i "/gain-downloader:/,\$/{/backend:/{n;s/tag: sha-[a-f0-9]*/tag: $SOURCE_BACKEND_TAG/}}" apps/rig/values.yaml
              fi
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/rig/config.yaml apps/rig/values.yaml
          git diff --cached --quiet || git commit -m "rig: $CHART_VERSION / $TAG"
          git push
